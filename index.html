    // Show only one screen at a time and set body bg class
    function showScreen(screen) {
      loginScreen.style.display = 'none';
      categoryScreen.style.display = 'none';
      quizScreen.style.display = 'none';
      resultScreen.style.display = 'none';

      document.body.className = '';

      if(screen === 'login') {
        loginScreen.style.display = 'block';
        document.body.classList.add('login-bg');
      } else if(screen === 'category') {
        categoryScreen.style.display = 'block';
        document.body.classList.add('category-bg');
      } else if(screen === 'quiz') {
        quizScreen.style.display = 'block';
        document.body.classList.add(`quiz-bg-${selectedCategoryId}`);
      } else if(screen === 'result') {
        resultScreen.style.display = 'block';
        document.body.classList.add('result-bg');
      }
    }

    // Render categories dynamically
    function renderCategories() {
      categoriesContainer.innerHTML = '';
      categoriesData.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.name;
        btn.dataset.id = cat.id;
        btn.addEventListener('click', () => {
          // Highlight selected
          Array.from(categoriesContainer.children).forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedCategoryId = cat.id;
          startQuizBtn.disabled = false;
        });
        categoriesContainer.appendChild(btn);
      });
      startQuizBtn.disabled = true;
    }

    // Fetch questions from Open Trivia DB
    async function fetchQuestions(categoryId) {
      try {
        const res = await fetch(`https://opentdb.com/api.php?amount=15&category=${categoryId}&type=multiple`);
        const data = await res.json();
        if(data.response_code !== 0) throw new Error('No questions found for this category.');
        return data.results;
      } catch (err) {
        alert('Error fetching questions: ' + err.message);
        return [];
      }
    }

    function shuffle(array) {
      for(let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function decodeHTML(html) {
      const txt = document.createElement('textarea');
      txt.innerHTML = html;
      return txt.value;
    }
